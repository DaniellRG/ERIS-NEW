version: "3.8"

services:
  eris:
    build: .
    container_name: eris
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8765:8765"
      - "8888:8888"
    volumes:
      - ./data:/eris/data
      - ./config:/eris/config
      - ./plugins:/eris/plugins
    environment:
      - ERIS_ENV=production
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  ollama:
    image: ollama/ollama:latest
    container_name: eris-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]

volumes:
  ollama_data:
