<!DOCTYPE html><html><head><meta charset="utf-8"></head>
<body style="margin:0;background:transparent">
<canvas id="c" width="300" height="300" style="width:300px;height:300px"></canvas>
<script>
var cv = document.getElementById('c');
var gl = cv.getContext('webgl') || cv.getContext('webgl2') || (document.body.textContent='NO GL') && null;
function report(tag, msg) { window.__gl = (window.__gl||[]).concat(tag+': '+msg); }
if (gl) {
  gl.viewport(0,0,300,300);
  gl.clearColor(1,0,0,1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  var px = new Uint8Array(4);
  gl.readPixels(150,150,1,1,gl.RGBA,gl.UNSIGNED_BYTE,px);
  report('center', px.join(','));
  var ok = gl.getError();
  report('error', String(ok));
  gl.finish();
}
document.body.dataset.glinfo = window.__gl ? window.__gl.join(' | ') : 'none';
</script></body></html>
