<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — Testdashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="sidebar">
        <h4 class="fw-bold mb-4 px-3"><i class="bi bi-grid-fill me-2" style="color:#a78bfa;"></i>Testdashboard</h4>
        <a href="#" class="active"><i class="bi bi-house-fill me-2"></i>Inicio</a>
        <a href="#"><i class="bi bi-bar-chart-fill me-2"></i>Estadisticas</a>
        <a href="#"><i class="bi bi-people-fill me-2"></i>Usuarios</a>
        <a href="#"><i class="bi bi-cart-fill me-2"></i>Ventas</a>
        <a href="#"><i class="bi bi-gear-fill me-2"></i>Configuracion</a>
    </div>
    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Dashboard</h2>
            <div><span class="badge bg-primary bg-opacity-25 text-primary px-3 py-2 rounded-pill">Ultima actualizacion: 28/07/2026 13:05</span></div>
        </div>
        <div class="row g-4 mb-4">
            <div class="col-md-3"><div class="stat-card"><p class="stat-label">Usuarios</p><p class="stat-value" style="color:#a78bfa;">1,234</p><small class="text-success"><i class="bi bi-arrow-up"></i> +12%</small></div></div>
            <div class="col-md-3"><div class="stat-card"><p class="stat-label">Ventas</p><p class="stat-value" style="color:#60a5fa;">$45.2K</p><small class="text-success"><i class="bi bi-arrow-up"></i> +8%</small></div></div>
            <div class="col-md-3"><div class="stat-card"><p class="stat-label">Visitas</p><p class="stat-value" style="color:#34d399;">89.1K</p><small class="text-danger"><i class="bi bi-arrow-down"></i> -3%</small></div></div>
            <div class="col-md-3"><div class="stat-card"><p class="stat-label">Tasa Conv.</p><p class="stat-value" style="color:#fbbf24;">12.5%</p><small class="text-success"><i class="bi bi-arrow-up"></i> +2.1%</small></div></div>
        </div>
        <div class="row g-4">
            <div class="col-md-8"><div class="card bg-transparent border-secondary"><div class="card-body"><canvas id="lineChart"></canvas></div></div></div>
            <div class="col-md-4"><div class="card bg-transparent border-secondary"><div class="card-body"><canvas id="doughnutChart"></canvas></div></div></div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
