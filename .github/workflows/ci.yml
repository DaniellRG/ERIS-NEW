name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8
  QT_QPA_PLATFORM: offscreen

jobs:
  validate:
    name: Validate (tool sync + compile)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            portaudio19-dev libportaudio2 libasound2-plugins \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libnotify4 \
            libgtk-3-0 xvfb
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validate tool registry/declarations sync
        run: python scripts/validate_tools.py
      - name: Compile check
        run: python -m compileall -q core actions agents

  tests:
    name: Test suite
    runs-on: ${{ matrix.os }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            portaudio19-dev libportaudio2 libasound2-plugins \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libnotify4 \
            libgtk-3-0 xvfb
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Seed data fixtures (fresh clone)
        run: python scripts/ci_seed.py
      - name: Run pytest
        run: python -m pytest tests/ -q
      - name: Run test_all.py
        run: python test_all.py
